[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "get-blobs-of-file-type"
version = "1.0.0"
description = "CLI utility to list Azure Blob Storage blobs matching a file extension"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Joel Shearon" }]
dependencies = [
    "azure-storage-blob>=12.24.0,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9",
    "pytest-cov>=6.0.0,<7",
    "ruff>=0.9.0,<1",
]

[project.scripts]
get-blobs-of-file-type = "get_blobs_of_file_type.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["get_blobs_of_file_type*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
